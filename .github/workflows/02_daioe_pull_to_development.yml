name: DAIOE Pull → Development

on:
  push:
    branches:
      - daioe_pull
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch to run scripts from"
        required: false
        default: "daioe_pull"
      target_branch:
        description: "Target branch to push data into"
        required: false
        default: "development"
  schedule:
    - cron: "30 0 * * *"  # daily at 00:30 UTC (offset from workflow 01)

concurrency:
  group: data-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write  # needed to trigger 03 via `gh workflow run` below

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POLARS_MAX_THREADS: "4"
  RELEASE_TAG: pipeline-data-latest


# ============ Build ============ #

jobs:
  build-data:
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.event.inputs.source_branch || vars.SOURCE_BRANCH || 'daioe_pull' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ">=3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download input data from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/processed
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            -p 'ssyk12_aggregated_ssyk4_to_ssyk1.parquet' -D data/processed --clobber

      - name: Run DAIOE pipeline
        run: |
          set -euo pipefail
          uv run python main.py

      - name: Upload data artifact
        uses: actions/upload-artifact@v7
        with:
          name: daioe-output
          path: data/daioe_scb_years_processed.parquet


# ============ Sync ============ #

  sync-target:
    runs-on: ubuntu-latest
    needs: build-data
    env:
      TARGET_BRANCH: ${{ github.event.inputs.target_branch || vars.TARGET_BRANCH || 'development' }}

    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Download data artifact
        uses: actions/download-artifact@v7
        with:
          name: daioe-output
          path: data/

      - name: Validate artifact
        run: |
          set -euo pipefail
          if [ ! -f "data/daioe_scb_years_processed.parquet" ]; then
            echo "ERROR: Missing expected parquet file in artifact."
            exit 1
          fi

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" data/daioe_scb_years_processed.parquet \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/daioe_scb_years_processed.parquet

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update daioe processed data [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); rebasing onto latest ${TARGET_BRANCH} and retrying..."
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            sleep $((attempt * 5))
          done

          echo "ERROR: failed to push to ${TARGET_BRANCH} after 5 attempts."
          exit 1

      - name: Trigger next stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run 03_development_to_main.yml --repo "${GITHUB_REPOSITORY}" --ref main


# ============ Keep daioe_pull's workflow copy in sync ============ #
# Same reason as 01's sync-workflow-copy job: `on: push: daioe_pull` needs a
# copy of this file checked in on daioe_pull itself to fire.

  sync-workflow-copy:
    runs-on: ubuntu-latest
    needs: sync-target
    env:
      SOURCE_BRANCH: ${{ github.event.inputs.source_branch || vars.SOURCE_BRANCH || 'daioe_pull' }}

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Fetch main
        run: git fetch origin main --depth=1

      - name: Sync workflow file from main
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          git show origin/main:.github/workflows/02_daioe_pull_to_development.yml \
            > .github/workflows/02_daioe_pull_to_development.yml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/02_daioe_pull_to_development.yml
          if git diff --cached --quiet; then
            echo "Workflow copy already in sync."
            exit 0
          fi
          git commit -m "chore: sync 02 workflow copy from main [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "${SOURCE_BRANCH}"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); rebasing onto latest ${SOURCE_BRANCH} and retrying..."
            git fetch origin "${SOURCE_BRANCH}"
            git rebase "origin/${SOURCE_BRANCH}"
            sleep $((attempt * 5))
          done

          echo "ERROR: failed to push to ${SOURCE_BRANCH} after 5 attempts."
          exit 1
