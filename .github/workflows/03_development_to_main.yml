name: Development → Main

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch to promote deploy files from"
        required: false
        default: "development"
      target_branch:
        description: "Target branch to push deploy files into"
        required: false
        default: "main"
  schedule:
    - cron: "45 0 * * *"  # daily at 00:45 UTC

concurrency:
  group: deploy-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


# ============ Promote deployable app files ============ #

jobs:
  sync-deploy-files:
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.event.inputs.source_branch || vars.SOURCE_BRANCH || 'development' }}
      TARGET_BRANCH: ${{ github.event.inputs.target_branch || vars.TARGET_BRANCH || 'main' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_BRANCH }}
          path: source

      - name: Validate deploy files
        run: |
          set -euo pipefail
          cd source
          required_files=(
            "app.py"
            "src/__init__.py"
            "src/constants.py"
            "src/data.py"
            "src/calcs.py"
            "src/visuals.py"
            "src/utils.py"
            "md_files/intro.md"
            "md_files/about.md"
            "data/daioe_scb_years_processed.parquet"
            "data/svenska_titlar.csv"
            "data/sok_nyckelord.csv"
            "Dockerfile"
            ".dockerignore"
            "pyproject.toml"
            "uv.lock"
            ".python-version"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required deploy file: $file"
              exit 1
            fi
          done

      - name: Create deploy bundle
        run: |
          set -euo pipefail
          cd source
          files=(
            "app.py"
            "src/__init__.py"
            "src/constants.py"
            "src/data.py"
            "src/calcs.py"
            "src/visuals.py"
            "src/utils.py"
            "md_files/intro.md"
            "md_files/about.md"
            "data/daioe_scb_years_processed.parquet"
            "data/svenska_titlar.csv"
            "data/sok_nyckelord.csv"
            "Dockerfile"
            ".dockerignore"
            "pyproject.toml"
            "uv.lock"
            ".python-version"
          )

          if [ -f "README.md" ]; then
            files+=("README.md")
          fi

          tar -czf ../deploy-files.tgz "${files[@]}"

      - name: Checkout target
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: target

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: source/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Gate: a failure here stops the job before anything is committed to
      # main, so a bad dataset is never deployed or released.
      - name: Validate the dataset before promoting it
        run: |
          set -euo pipefail
          previous_args=()
          if [ -f target/data/daioe_scb_years_processed.parquet ]; then
            previous_args=(--previous target/data/daioe_scb_years_processed.parquet)
          fi
          uv run --no-project --with polars python source/scripts/validate.py \
            source/data/daioe_scb_years_processed.parquet "${previous_args[@]}"

      - name: Apply deploy bundle
        run: |
          set -euo pipefail
          tar -xzf deploy-files.tgz -C target

      - name: Commit and push
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- \
            app.py \
            src/__init__.py \
            src/constants.py \
            src/data.py \
            src/calcs.py \
            src/visuals.py \
            src/utils.py \
            md_files/intro.md \
            md_files/about.md \
            data/daioe_scb_years_processed.parquet \
            data/svenska_titlar.csv \
            data/sok_nyckelord.csv \
            Dockerfile \
            .dockerignore \
            pyproject.toml \
            uv.lock \
            .python-version

          if [ -f "README.md" ]; then
            git add README.md
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: promote deployable app files [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); rebasing onto latest ${TARGET_BRANCH} and retrying..."
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            sleep $((attempt * 5))
          done

          echo "ERROR: failed to push to ${TARGET_BRANCH} after 5 attempts."
          exit 1

      # dataset-latest is the current published dataset and is overwritten on
      # every run; the previous copy is downloaded first so the snapshot step
      # can tell whether the content changed.
      - name: Download the previous dataset release for comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          gh release download dataset-latest --repo "${GITHUB_REPOSITORY}" \
            -p 'daioe_scb_years_processed.parquet' -D previous --clobber || \
            echo "No previous dataset release yet; a dated snapshot will be created."

      - name: Publish the dataset-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view dataset-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create dataset-latest --repo "${GITHUB_REPOSITORY}" \
              --target main \
              --title "AI-SCB Years - dataset (latest)" \
              --notes "Latest published dataset."
          gh release upload dataset-latest source/data/daioe_scb_years_processed.parquet \
            --repo "${GITHUB_REPOSITORY}" --clobber

      # dataset-latest cannot be cited as a fixed version. When the published
      # bytes change (or no dated release exists yet), also keep them under
      # dataset-YYYY-MM-DD. The tag points at main's newest commit, which by now
      # carries this same file. A second change on the same day updates that
      # day's release.
      - name: Snapshot a dated release when the dataset changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          new_file=source/data/daioe_scb_years_processed.parquet
          old_file=previous/daioe_scb_years_processed.parquet
          new_sha=$(sha256sum "${new_file}" | cut -d' ' -f1)
          old_sha=""
          if [ -f "${old_file}" ]; then
            old_sha=$(sha256sum "${old_file}" | cut -d' ' -f1)
          fi
          dated_count=$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 200 \
            --json tagName -q '[.[] | select(.tagName | startswith("dataset-2"))] | length')
          if [ "${new_sha}" = "${old_sha}" ] && [ "${dated_count}" != "0" ]; then
            echo "Dataset unchanged and a dated release already exists; no snapshot."
            exit 0
          fi

          day=$(date -u +%F)
          tag="dataset-${day}"
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" \
              --target main \
              --title "AI-SCB Years - dataset ${day}" \
              --notes "Snapshot of the published dataset, ${day}."
          gh release upload "${tag}" "${new_file}" \
            --repo "${GITHUB_REPOSITORY}" --clobber
