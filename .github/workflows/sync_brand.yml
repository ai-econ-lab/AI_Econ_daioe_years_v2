name: Sync brand assets

on:
  schedule:
    - cron: "0 3 * * *"  # daily at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch canonical brand assets
        run: |
          set -euo pipefail
          mkdir -p logos
          curl -fsSL https://raw.githubusercontent.com/ai-econ-lab/brand/main/_brand.yml -o _brand.yml
          curl -fsSL https://raw.githubusercontent.com/ai-econ-lab/brand/main/logos/lab.svg -o logos/lab.svg

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _brand.yml logos/lab.svg
          if git diff --cached --quiet; then
            echo "Brand assets already in sync."
            exit 0
          fi
          git commit -m "chore: sync brand assets from ai-econ-lab/brand [skip ci]"
          git push
