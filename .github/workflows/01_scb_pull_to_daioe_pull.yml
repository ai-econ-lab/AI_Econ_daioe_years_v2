name: SCB Pull → DAIOE Pull

on:
  push:
    branches:
      - scb_pull
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch to run scripts from"
        required: false
        default: "scb_pull"
  schedule:
    - cron: "0 0 * * *"  # daily at 00:00 UTC

concurrency:
  group: data-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write  # needed to trigger 02 via `gh workflow run` below

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POLARS_MAX_THREADS: "4"
  # Single repo-wide release holding every stage's parquet output, replacing
  # the per-branch git commits that were growing this repo on every run even
  # when the underlying SCB data hadn't changed. Every stage across 01-03
  # uploads its output here instead of committing it onto the target branch;
  # consumers `gh release download` their inputs from here rather than
  # relying on the target branch's git tree already having them.
  RELEASE_TAG: pipeline-data-latest


# ============ Build ============ #

jobs:
  build-data:
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.event.inputs.source_branch || vars.SOURCE_BRANCH || 'scb_pull' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ">=3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run data scripts
        run: |
          set -euo pipefail
          uv run python scripts/pull.py
          uv run python scripts/merge.py
          uv run python scripts/aggregate.py

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --target main \
              --title "Pipeline data (latest)" \
              --notes "Auto-updated by the data pipeline; each asset is superseded on every run. Not a versioned release."
          gh release upload "${RELEASE_TAG}" \
            data/processed/ssyk12_aggregated_ssyk4_to_ssyk1.parquet \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Trigger next stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run 02_daioe_pull_to_development.yml --repo "${GITHUB_REPOSITORY}" --ref main


# ============ Keep scb_pull's workflow copy in sync ============ #
# This workflow lives only on `main`; `on: push: scb_pull` needs a copy of
# this file checked in on scb_pull itself to fire, because GitHub resolves
# push-event triggers from the pushed ref's own tree, not the default
# branch. Re-publish main's copy onto scb_pull after every run so a manual
# edit here never drifts out of sync with what actually runs, and so a
# plain push to scb_pull keeps triggering this workflow immediately instead
# of only running on the daily schedule.

  sync-workflow-copy:
    runs-on: ubuntu-latest
    needs: build-data
    env:
      SOURCE_BRANCH: ${{ github.event.inputs.source_branch || vars.SOURCE_BRANCH || 'scb_pull' }}

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Fetch main
        run: git fetch origin main --depth=1

      - name: Sync workflow file from main
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          git show origin/main:.github/workflows/01_scb_pull_to_daioe_pull.yml \
            > .github/workflows/01_scb_pull_to_daioe_pull.yml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/01_scb_pull_to_daioe_pull.yml
          if git diff --cached --quiet; then
            echo "Workflow copy already in sync."
            exit 0
          fi
          git commit -m "chore: sync 01 workflow copy from main [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "${SOURCE_BRANCH}"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); rebasing onto latest ${SOURCE_BRANCH} and retrying..."
            git fetch origin "${SOURCE_BRANCH}"
            git rebase "origin/${SOURCE_BRANCH}"
            sleep $((attempt * 5))
          done

          echo "ERROR: failed to push to ${SOURCE_BRANCH} after 5 attempts."
          exit 1
