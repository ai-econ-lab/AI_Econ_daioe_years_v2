# ─────────────────────────────────────────────
# _brand.yml — AI-Econ Lab
# Canonical palette/type mirrored from ai-econ-lab.github.io's assets/styles.css
# (navy #232b65 institutional identity + Okabe-Ito CVD-safe data ramp).
# ─────────────────────────────────────────────

meta:
  name: AI-Econ Lab
  link: https://ai-econlab.com

logo:
  images:
    lab: logos/lab.svg
  small:  lab
  medium: lab
  large:  lab

# ─── Color ───────────────────────────────────
color:
  palette:
    navy:    "#232b65"
    navy-2:  "#33407f"
    ink:     "#161d2b"
    neutral: "#f3f5f8"
    white:   "#ffffff"
    blue:    "#0072b2"
    orange:  "#d55e00"
    green:   "#009e73"
    pink:    "#cc79a7"
    link:    "#065f92"
    muted:   "#65717f"

  background: neutral
  foreground: ink
  primary:    navy
  secondary:  blue
  tertiary:   navy-2
  success:    green
  info:       blue
  warning:    orange
  danger:     pink
  light:      neutral
  dark:       ink

# ─── Typography ──────────────────────────────
# System stacks, matching the site's --serif/--sans/--mono tokens. No Google
# Fonts: this also drops three font requests from a Space's cold start.
typography:
  base:
    family:      'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
    size:        1rem
    weight:      400
    line-height: 1.5

  headings:
    family:      '"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif'
    weight:      700
    color:       primary
    line-height: 1.2

  monospace:
    family: 'ui-monospace, "SF Mono", Menlo, "Cascadia Mono", "DejaVu Sans Mono", monospace'
    size:   0.9em
    weight: 400

  monospace-inline:
    color:            primary
    background-color: light

  monospace-block:
    color:            foreground
    background-color: light
    line-height:      1.6

  link:
    color:      link
    decoration: underline

# ─── Framework defaults ──────────────────────
defaults:
  bootstrap:
    defaults:
      font-family-sans-serif: '"system-ui", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
      font-family-monospace:  'ui-monospace, "SF Mono", Menlo, "Cascadia Mono", "DejaVu Sans Mono", monospace'
